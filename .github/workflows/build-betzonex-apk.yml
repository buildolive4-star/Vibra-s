name: Build BetZone X Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package BetZone X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK, Keystore & Config Files
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set +o pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat <<'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-vibra-3d9fe81b-e4c3-4539-aa7b-f5e06c70d485</string>
          </resources>
          EOF
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if [[ "$trimmed" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
            SHA1_HEX="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | awk -F'SHA-?1:[[:space:]]*' '/SHA-?1:/{gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')"
            python3 - "$SHA1_HEX" <<'PYEOF'
import json, sys

sha1_hex = sys.argv[1].strip().lower()
pkg = "com.aistudio.betzonex.krvmpx"
path = "app/google-services.json"

with open(path, "r", encoding="utf-8") as f:
    data = json.load(f)

clients = data.get("client", [])
has_pkg = any(
    c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg
    for c in clients
)

if not has_pkg and clients:
    template = clients[0]
    proj_num = data.get("project_info", {}).get("project_number", "")
    web_clients = [oc for oc in template.get("oauth_client", []) if oc.get("client_type") == 3]
    android_client = {
        "client_id": f"{proj_num}-betzonex.apps.googleusercontent.com",
        "client_type": 1,
        "android_info": {
            "package_name": pkg,
            "certificate_hash": sha1_hex,
        },
    }
    new_entry = {
        "client_info": {
            "mobilesdk_app_id": f"1:{proj_num}:android:cdd593f56fd5945ca02f41",
            "android_client_info": {"package_name": pkg},
        },
        "oauth_client": [android_client] + web_clients,
        "api_key": template.get("api_key", []),
        "services": template.get("services", {}),
    }
    clients.insert(0, new_entry)
    data["client"] = clients
    with open(path, "w", encoding="utf-8") as f:
        json.dump(data, f, indent=2)
    print(f"Auto-registered {pkg} into app/google-services.json from existing Firebase project config.")
else:
    print(f"Verified {pkg} present in app/google-services.json.")
PYEOF
            echo "Restored and validated app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repo or GOOGLE_SERVICES_JSON secret; injecting CI-only OAuth placeholder so APK compiles."
            mkdir -p app/src/main/res/values
            cat <<'EOF' > app/src/main/res/values/ci_fallback_oauth.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false"></string>
          </resources>
          EOF
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build BetZone X APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BetZoneX-Android.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetZoneX-Android-APK
          path: dist/BetZoneX-Android.apk
          retention-days: 30

      - name: Publish Direct Download APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: betzonex-latest
          name: BetZone X Android APK (Latest Build)
          body: |
            Automated build of **BetZone X** (`com.aistudio.betzonex.krvmpx`).
            Download `BetZoneX-Android.apk` below to install on Android.
          files: dist/BetZoneX-Android.apk
          make_latest: true
